<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- Desktop layout on both phones and computers -->
  <meta name="viewport" content="width=1400">
  <title>Entry List | Team | 7th Thailand Open Masters Games 2027</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1400px; font: 15px Arial, Tahoma, sans-serif; color: #1d2e40; background: #f3f6fa; }
    .site-header { background: linear-gradient(115deg, #092e61, #075fa6); color: white; padding: 28px 24px 32px; text-align: center; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 3px; opacity: .85; }
    h1 { font-size: 34px; margin: 8px 0; }
    .event-title { font-size: 21px; font-weight: 400; margin: 0; color: #e3f1ff; }
    .page-nav { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
    .page-nav a { display: inline-block; min-width: 145px; padding: 10px 20px; border-radius: 28px; border: 1px solid #aacbe5; color: white; text-decoration: none; font-weight: 700; }
    .page-nav a.active { background: white; color: #064c8a; border-color: white; }
    .page-nav a:not(.active):hover { background: #ffffff22; }
    .container { width: 1260px; margin: 24px auto 44px; }
    .filter-panel { background: #fff; border-radius: 14px; box-shadow: 0 5px 20px #0e376015; padding: 20px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 110px; gap: 12px; }
    .filters input, .filters select, .filters button { width: 100%; min-width: 0; height: 44px; padding: 0 12px; border-radius: 9px; font: inherit; }
    .filters input, .filters select { color: #1d2e40; background: #fff; border: 1px solid #cbd5e1; }
    .filters input:focus, .filters select:focus { outline: 2px solid #8cb9e6; outline-offset: 1px; }
    .filters button { color: white; background: #075ca5; font-weight: 700; cursor: pointer; border: none; }
    .filters button:hover { background: #064b88; }
    .bar { display: flex; align-items: center; justify-content: space-between; margin: 18px 1px 12px; }
    .count { font-weight: bold; font-size: 16px; }
    .hint { color: #64748b; font-size: 13px; }
    .table-panel { min-height: 130px; overflow-x: auto; border-radius: 14px; background: #fff; box-shadow: 0 5px 20px #0e376015; }
    table { width: 100%; border-collapse: collapse; min-width: 1260px; }
    thead { background: #0d427e; color: #fff; }
    th { text-align: left; padding: 14px 13px; white-space: nowrap; }
    th button { border: 0; cursor: pointer; font: inherit; background: transparent; color: inherit; font-weight: 700; padding: 0; }
    th button:hover, th button:focus-visible { text-decoration: underline; }
    td { padding: 12px 13px; border-top: 1px solid #e7edf4; white-space: nowrap; }
    tbody tr:nth-child(even) { background: #f9fbfe; }
    tbody tr:hover { background: #edf6ff; }
    .message { padding: 38px 20px; color: #607286; text-align: center; font-size: 17px; }
    .message.error { color: #a12727; }
    footer { color: #64748b; font-size: 12px; text-align: center; padding: 0 0 24px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="eyebrow">ENTRY LIST</div>
    <h1>Team</h1>
    <p class="event-title" id="eventTitle">7th Thailand Open Masters Games 2027</p>
    <nav class="page-nav" aria-label="Entry list pages">
      <a href="tomg2027-singles.html" >Singles</a>
      <a href="tomg2027-team.html" class="active" aria-current="page">Team</a>
    </nav>
  </header>

  <main class="container">
    <section class="filter-panel" aria-label="Search and filters">
      <div class="filters">
        <input id="nameSearch" type="search" placeholder="Search Name" aria-label="Search Name">
        <input id="teamSearch" type="search" placeholder="Search Team" aria-label="Search Team">
        <input id="countrySearch" type="search" placeholder="Search Country" aria-label="Search Country">
        <select id="eventFilter" aria-label="Filter Event"><option value="">All Event</option></select>
        <button id="resetButton" type="button">Reset</button>
      </div>
    </section>
    <div class="bar">
      <div class="count" id="summary">Loading entries...</div>
      <div class="hint">Click a column heading to sort A–Z / ก–ฮ</div>
    </div>
    <section class="table-panel" id="tableArea"><div class="message">กำลังโหลดข้อมูล...</div></section>
  </main>
  <footer>Data is loaded from the published Google Sheet. Updates may take several minutes to appear.</footer>

<script>
  // Google Sheet: A1 = competition name, row 2 = blank, row 3 = headers, row 4+ = entries.
  const PAGE = {
    type: "Team",
    csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJrSFSjCSq7wM-GfBvcImHV4neDtk59PaUwLX2KPTRkcy5zby9yopVCV0PDJoolIPgOqtt-fWZvqgp/pub?gid=179209219&single=true&output=csv",
    columns: ["Event", "Country", "Team", "Name1", "Name2", "Name3", "Name4"],
    searchNames: ["Name1", "Name2", "Name3", "Name4"],
    countUnit: "Teams"
  };

  let allRows = [];
  let displayedRows = [];
  let sortKey = null;
  let sortDirection = 1;
  const $ = (id) => document.getElementById(id);
  const normalize = (value) => String(value ?? "").trim();
  const comparable = (value) => normalize(value).toLocaleLowerCase();

  // English names first, then Thai; numeric substrings compare naturally.
  function compareLabels(a, b) {
    const x = normalize(a), y = normalize(b);
    const group = s => /^[A-Za-z]/.test(s) ? 0 : /^[ก-๙]/.test(s) ? 1 : 2;
    const groupDiff = group(x) - group(y);
    return groupDiff || x.localeCompare(y, ["en", "th"], { sensitivity: "base", numeric: true });
  }

  function message(text, isError = false) {
    $("tableArea").replaceChildren();
    const div = document.createElement("div");
    div.className = "message" + (isError ? " error" : "");
    div.textContent = text;
    $("tableArea").append(div);
  }

  function displayRows() {
    const termName = comparable($("nameSearch").value);
    const termTeam = comparable($("teamSearch").value);
    const termCountry = comparable($("countrySearch").value);
    const eventValue = $("eventFilter").value;
    displayedRows = allRows.filter(row =>
      PAGE.searchNames.some(field => comparable(row[field]).includes(termName)) &&
      comparable(row.Team).includes(termTeam) &&
      comparable(row.Country).includes(termCountry) &&
      (!eventValue || row.Event === eventValue)
    );
    if (sortKey) displayedRows.sort((a, b) => compareLabels(a[sortKey], b[sortKey]) * sortDirection);
    render();
  }

  function sortBy(field) {
    if (sortKey === field) sortDirection *= -1;
    else { sortKey = field; sortDirection = 1; }
    displayRows();
  }

  function render() {
    $("summary").textContent = `Total ${PAGE.countUnit}: ${displayedRows.length} / ${allRows.length}`;
    if (!allRows.length) { message("ยังไม่มีรายชื่อใน Google Sheet"); return; }
    if (!displayedRows.length) { message("ไม่พบข้อมูลที่ตรงกับการค้นหา"); return; }

    const table = document.createElement("table");
    const head = document.createElement("thead");
    const headRow = document.createElement("tr");
    for (const col of PAGE.columns) {
      const th = document.createElement("th");
      if (sortKey === col) th.setAttribute("aria-sort", sortDirection === 1 ? "ascending" : "descending");
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = col + (sortKey === col ? (sortDirection === 1 ? " ▲" : " ▼") : "");
      button.addEventListener("click", () => sortBy(col));
      th.append(button); headRow.append(th);
    }
    head.append(headRow); table.append(head);
    const tbody = document.createElement("tbody");
    for (const entry of displayedRows) {
      const tr = document.createElement("tr");
      for (const col of PAGE.columns) {
        const td = document.createElement("td");
        td.textContent = entry[col] || "";
        tr.append(td);
      }
      tbody.append(tr);
    }
    table.append(tbody);
    $("tableArea").replaceChildren(table);
  }

  function setEventOptions() {
    const select = $("eventFilter");
    const opts = [...new Set(allRows.map(row => row.Event).filter(Boolean))].sort(compareLabels);
    select.replaceChildren(new Option("All Event", ""));
    for (const option of opts) select.add(new Option(option, option));
  }

  function loadEntries() {
    if (!window.Papa) { message("ไม่สามารถโหลดตัวอ่าน CSV ได้ กรุณาตรวจสอบอินเทอร์เน็ต", true); return; }
    Papa.parse(PAGE.csvUrl, {
      download: true, header: false, skipEmptyLines: false,
      complete: result => {
        const rows = result.data || [];
        const headers = (rows[2] || []).map(normalize);
        const missing = PAGE.columns.filter(field => !headers.includes(field));
        if (missing.length) {
          $("summary").textContent = "Data format error";
          message("หัวตาราง Google Sheet ไม่ถูกต้อง หรือใช้ลิงก์ผิดชีท: " + missing.join(", "), true);
          return;
        }
        const eventTitle = normalize(rows[0]?.[0]) || "7th Thailand Open Masters Games 2027";
        $("eventTitle").textContent = eventTitle;
        document.title = `Entry List | ${PAGE.type} | ${eventTitle}`;
        allRows = rows.slice(3).map(cells => {
          const obj = {};
          headers.forEach((key, index) => { if (key) obj[key] = normalize(cells[index]); });
          return obj;
        }).filter(row => PAGE.columns.some(key => row[key]));
        setEventOptions();
        displayRows();
      },
      error: () => {
        $("summary").textContent = "Unable to load entries";
        message("ไม่สามารถโหลด Google Sheet ได้ กรุณาตรวจสอบการเผยแพร่ CSV และอินเทอร์เน็ต", true);
      }
    });
  }

  ["nameSearch", "teamSearch", "countrySearch"].forEach(id => $(id).addEventListener("input", displayRows));
  $("eventFilter").addEventListener("change", displayRows);
  $("resetButton").addEventListener("click", () => {
    ["nameSearch", "teamSearch", "countrySearch"].forEach(id => { $(id).value = ""; });
    $("eventFilter").value = "";
    sortKey = null; sortDirection = 1;
    displayRows();
  });
  loadEntries();
</script>
</body>
</html>
